name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Universal binary (Apple Silicon + Intel)
          - os: macos-latest
            target: universal-apple-darwin
          # Ubuntu - Linux bundles
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Windows - 64-bit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      NO_STRIP: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            cargo-c \
            linuxdeploy \
            appimagetool

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenSSA ${{ github.ref_name }}"
          releaseBody: |
            ## OpenSSA ${{ github.ref_name }}
            
            Cross-platform local-first system cleaner, storage analyzer, and resource monitor.
            
            ### Installers
            - **macOS**: Universal `.dmg` (Apple Silicon + Intel)
            - **Linux**: `.deb`, `.AppImage`, `.rpm` (x86_64)
            - **Windows**: `.exe` (NSIS), `.msi` (x86_64)
            
            ### Highlights
            - Fixed tab switching crashes with error boundaries
            - Revamped light mode with high-contrast monochrome theme
            - Sidebar navigation cleanup
            - TypeScript strict mode compliance
            
            ### License
            MIT License (2026)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

