name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage, .deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OpenSSA/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: OpenSSA/src-tauri

      - name: Install npm dependencies
        working-directory: OpenSSA
        run: npm ci

      - name: Build Tauri App
        working-directory: OpenSSA
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenSSA ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version for Linux, Windows, and macOS."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

  build-windows:
    name: Build Windows (.msi, .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OpenSSA/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: OpenSSA/src-tauri

      - name: Install npm dependencies
        working-directory: OpenSSA
        run: npm ci

      - name: Build Tauri App
        working-directory: OpenSSA
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenSSA ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version for Linux, Windows, and macOS."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

  build-macos:
    name: Build macOS (.dmg, .app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OpenSSA/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: OpenSSA/src-tauri

      - name: Install npm dependencies
        working-directory: OpenSSA
        run: npm ci

      - name: Build Tauri App
        working-directory: OpenSSA
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenSSA ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version for Linux, Windows, and macOS."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

  build-macos-arm:
    name: Build macOS ARM64 (.dmg, .app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OpenSSA/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workdir: OpenSSA/src-tauri

      - name: Install npm dependencies
        working-directory: OpenSSA
        run: npm ci

      - name: Build Tauri App
        working-directory: OpenSSA
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenSSA ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version for Linux, Windows, and macOS."
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin